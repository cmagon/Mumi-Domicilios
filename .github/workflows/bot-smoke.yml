name: Prueba de humo del bot
on:
  pull_request:
    paths: ['supabase/functions/**', 'bot-tests/**']
  push:
    branches-ignore: [main]
    paths: ['supabase/functions/**', 'bot-tests/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd bot-tests && npm install && npm test
